name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Release & Publish (OIDC)
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Pixerate' || github.event_name == 'workflow_dispatch'

    steps:
      # The tip of main, not the commit that triggered this run: when merges land
      # close together, an earlier run's version commit is already on main, and
      # versioning the older commit again would compute a version that is published.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN_FOR_PACKAGES || secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: changeset_check
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "count=$CHANGESETS" >> $GITHUB_OUTPUT
          if [ "$CHANGESETS" -gt "0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Release required. Pending changesets: $CHANGESETS"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "No pending changesets found. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.changeset_check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version package & update CHANGELOG.md
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm version-packages

      - name: Build package
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm build

      - name: Run unit tests
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm test

      # Push the version commit before publishing, so a version is only ever
      # published once main records it. If another merge landed meanwhile, rebase
      # onto it (the version commit only touches package.json, the changelog and
      # the changesets it used); a push that still fails stops before publishing,
      # and the next run (or a manual run) releases from main as it is.
      - name: Commit version bumps & changelogs
        if: steps.changeset_check.outputs.should_release == 'true'
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore(release): version package and update changelog [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved on; rebasing the version commit (attempt $attempt)"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          echo "Could not push the version commit; nothing was published."
          exit 1

      # Publishes whatever version package.json says that npm doesn't have yet,
      # so a manual run after a failed publish finishes the release.
      - name: Publish to npm (OIDC)
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push release tags
        if: steps.changeset_check.outputs.should_release == 'true'
        run: git push origin --tags
