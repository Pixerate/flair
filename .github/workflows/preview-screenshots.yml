name: Preview Screenshots

on:
  pull_request:
    branches:
      - main
    paths:
      - 'swift/**/*.swift'
      - 'swift/Package.swift'
      - '.github/workflows/preview-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: preview-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render-previews:
    name: Render Preview Screenshots
    runs-on: macos-26
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Render macOS preview screenshots
        run: |
          mkdir -p docs/previews
          FLAIR_PREVIEW_EXPORT_DIR="$PWD/docs/previews" \
          swift test --package-path swift --filter PreviewSnapshotTests

      - name: Commit updated preview screenshots
        run: |
          if [ -z "$(git status --porcelain docs/previews)" ]; then
            echo "No preview screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews
          git commit -m "chore: update preview screenshots [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
