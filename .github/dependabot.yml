version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    groups:
      # @pixerate/editor is an optional peer; its updates land on their own so the peer range is reviewed.
      pixerate:
        patterns:
          - "@pixerate/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
